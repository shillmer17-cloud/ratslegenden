name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: News prüfen
        run: node scripts/check-news.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub meldet beim Veröffentlichen manchmal kurzzeitig "try again later".
      # Dann eine Minute warten und automatisch ein zweites Mal versuchen.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Kurz warten vor zweitem Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
